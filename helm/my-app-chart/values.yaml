# --- Global Configuration ---
namespace: default
appName: my-app

# --- Deployment Configuration ---
replicaCount: 1

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  liveness:
    path: /
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

# --- Service Configuration ---
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# --- Ingress Configuration ---
ingress:
  enabled: true
  className: nginx
  host: myapp.local
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

# --- Autoscaling (HPA) Configuration ---
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# --- Persistent Volume (PVC) Configuration ---
storage:
  enabled: true
  storageClassName: azure-managed-disk
  accessMode: ReadWriteOnce
  size: 5Gi

# --- ConfigMap Environment Variables ---
env:
  ENVIRONMENT: "production"
  DB_HOST: "postgres-db-service"
  DB_PORT: "5432"
  DB_NAME: "mydb"
  DB_USER: "postgres"
  REDIS_HOST: "redis-cache-service"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  FEATURE_NEW_CHECKOUT: "true"

# --- Secrets (Values can be set via --set or sealed-secrets) ---
secrets:
  DB_PASSWORD: "password123"
  API_KEY: "example-api-key"
  JWT_SECRET: "jwt-secret-123"